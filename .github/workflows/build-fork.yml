name: Build Fork Image

on:
  push:
    branches:
      - fix/permanent-errors-and-rate-limit
      - main
      - upgrade/2.0.140

permissions:
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/rdtclient

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      # The `:patched` tag is the production tag the mini pulls. Only the
      # blessed branches move it. The upgrade branch builds a *staging* tag
      # so CI validates the build without a production deploy — promotion to
      # `:patched` is a separate, human-approved merge to main / the patch branch.
      - name: Determine image tags
        id: tags
        run: |
          if [ "${{ github.ref_name }}" = "upgrade/2.0.140" ]; then
            echo "tags<<EOF" >> "$GITHUB_OUTPUT"
            echo "${{ env.IMAGE }}:upgrade-2.0.140" >> "$GITHUB_OUTPUT"
            echo "${{ env.IMAGE }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "tags<<EOF" >> "$GITHUB_OUTPUT"
            echo "${{ env.IMAGE }}:patched" >> "$GITHUB_OUTPUT"
            echo "${{ env.IMAGE }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
